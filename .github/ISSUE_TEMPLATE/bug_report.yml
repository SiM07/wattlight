name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw (a screenshot of the app helps).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WattLight version
      description: Settings › About, or `wattlight --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Sensor and lights
      description: e.g. Tacx Neo 2T + Hue Play bars, Garmin HRM-Pro + Hue Go
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: macOS `~/Library/Logs/wattlight.log`, Windows the minimized console window, Linux the terminal.
      render: text
